services:
  somonwatch:
    container_name: somon-rent-watcher
    image: somon-rent-watcher:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_PATH: /var/lib/somonwatch/somonwatch.db
      DEBUG_DIR: /var/lib/somonwatch/debug
    volumes:
      - somonwatch-data:/var/lib/somonwatch
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  somonwatch-data:
    name: somon-rent-watcher-data
